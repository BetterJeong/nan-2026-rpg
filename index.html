<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nan-2026-rpg</title>
    <style>
      :root {
        --bg: #0f1419;
        --fg: #e8eef4;
        --muted: #8b9aab;
        --accent: #5ec8a8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", "Apple SD Gothic Neo", sans-serif;
        color: var(--fg);
        background:
          radial-gradient(ellipse 80% 60% at 20% 20%, #1a3a32 0%, transparent 50%),
          radial-gradient(ellipse 70% 50% at 80% 80%, #1e2a3a 0%, transparent 45%),
          var(--bg);
      }

      main {
        text-align: center;
        padding: 2rem;
      }

      h1 {
        font-size: clamp(1.75rem, 5vw, 2.75rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 0.75rem;
      }

      p {
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .badge {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.35rem 0.85rem;
        font-size: 0.8rem;
        color: var(--accent);
        border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>nan-2026-rpg</h1>
      <p>GitHub Pages 배포용 임시 페이지입니다.</p>
      <span class="badge">Coming soon</span>
    </main>
  </body>
</html>
