<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevQuest — IDE RPG</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1e1e1e;
        color: #cccccc;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #boot {
        padding: 24px;
        font-size: 13px;
        line-height: 1.7;
        white-space: pre-wrap;
      }
      #boot b {
        color: #4ec9b0;
      }
      #boot code {
        color: #9cdcfe;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot">
        <b>DevQuest</b> booting...

        If this screen stays, open via the dev server:
        run <code>npm run dev</code> and open the URL shown in the terminal.
        Opening the file directly (<code>file://</code>) will not work.
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
